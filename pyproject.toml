[project]
name = "ubuntu-ferret-scanner"
version = "0.1.0"
description = "Independent Ubuntu app for the Creality Ferret 3D scanner"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "pillow>=11",
    "PyOpenGL>=3.1.7",
    "PyQt6>=6.8",
    "scikit-image>=0.25",
    "scipy>=1.14",
    "torch>=2.7",
]

[project.scripts]
ubuntu-ferret-scanner = "ubuntu_ferret_scanner.main:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"
